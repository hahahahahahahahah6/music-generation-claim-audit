[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-generation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor using static Python evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
music-generation-claim-audit = "music_generation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["music_generation_claim_audit*"]
